<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Widget Demo — JOSA CHATS</title><link rel="icon" href="/assets/logo.svg"><link rel="stylesheet" href="/css/base.css"></head><body><header class="site-header"><div class="container nav"><a class="logo" href="/"><img src="/assets/logo.svg" alt="">JOSA CHATS</a><div class="nav-links"><a href="/">Home</a><a href="/dashboard.html">Dashboard</a></div></div></header><main class="container section"><div class="section-head"><h1>Website widget demo</h1><p>Paste an agent ID to load the live floating widget.</p></div><div class="card" style="max-width:640px"><label>Agent ID<input id="agent-id" placeholder="UUID from My AI Agents"></label><button class="btn primary" id="load-widget">Load widget</button><label>Embed code<textarea id="code" readonly></textarea></label></div></main><script>document.getElementById('load-widget').addEventListener('click', function(){var id=document.getElementById('agent-id').value.trim();if(!id)return;document.getElementById('code').value='<script src="'+location.origin+'/widget/widget.js?agent='+encodeURIComponent(id)+'" data-agent-id="'+id+'" async><\/script>';var old=document.getElementById('vd-widget-frame');if(old)old.remove();var oldBtn=document.getElementById('vd-widget-launcher');if(oldBtn)oldBtn.remove();var script=document.createElement('script');script.src=location.origin+'/widget/widget.js?agent='+encodeURIComponent(id);script.async=true;document.body.appendChild(script);});</script></body></html>
