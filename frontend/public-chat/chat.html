<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Support Chat</title><link rel="icon" href="/assets/logo.svg"><link rel="stylesheet" href="/css/base.css"></head><body><main class="chat-page" id="chat-root"><header class="chat-head"><div class="chat-avatar" id="chat-avatar">AI</div><div style="flex:1"><strong id="chat-title">AI Support</strong><div class="small muted" id="chat-status">Connecting...</div></div><button class="icon-btn theme-toggle" aria-label="Toggle theme">☾</button><button class="icon-btn hidden" id="chat-close" aria-label="Close chat">×</button></header><div class="chat-messages" id="chat-messages"></div><footer class="chat-controls"><div class="row"><select id="chat-language"></select><span class="small muted" id="voice-status"></span></div><form class="chat-actions" id="chat-form"><input id="chat-input" placeholder="Type your message..." autocomplete="off"><button class="btn primary" id="chat-send" type="submit">Send</button><button class="btn" id="chat-mic" type="button">Mic</button></form><div class="row wrap"><button class="btn small" id="chat-handoff">Talk to a human</button><div id="chat-feedback" class="row wrap"></div></div></footer></main><script type="module" src="/public-chat/js/chat.js"></script></body></html>
